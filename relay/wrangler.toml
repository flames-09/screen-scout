name = "screen-scout-relay"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true

# Free-tier budgets and limits. Change these and redeploy — the desktop app
# reads the resulting limits from response headers, so no app release needed.
[vars]
PUBLIC_MODEL_ID = "scout-vision-1"
# Groq serves TEXT-ONLY turns (the account's free tier has no vision model);
# image questions go to NVIDIA's vision model first (when its secret is set)
# and fall back to the Workers AI multimodal model below.
GROQ_MODEL = "openai/gpt-oss-120b"
CF_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
NVIDIA_MODEL = "nvidia/nemotron-3.5-super-vl-120b-a12b"
DEVICE_PER_DAY = "30"
DEVICE_PER_WINDOW = "10"
WINDOW_HOURS = "5"
GLOBAL_GROQ_PER_DAY = "900"
GLOBAL_CF_PER_DAY = "130"
# NVIDIA has no published daily cap (about 40 RPM per account) — this relay
# cap keeps it predictable. NVIDIA_API_KEY itself is a SECRET:
#   npx wrangler secret put NVIDIA_API_KEY
GLOBAL_NVIDIA_PER_DAY = "400"
MAX_BODY_BYTES = "6291456"
REGISTRATIONS_PER_IP_PER_DAY = "20"
# Google-account daily split (first-run choice: Google sign-in or own key).
# GOOGLE_CLIENT_ID is the PUBLIC OAuth client id — safe as a var, but keep it
# empty until the OAuth client exists; empty = /v1/auth/google answers 503.
GOOGLE_CLIENT_ID = "461964937671-5nkjuee4m9r21uj93hvn99socga293m9.apps.googleusercontent.com"
ACCOUNT_IMAGE_PER_DAY = "5"
ACCOUNT_CHAT_PER_DAY = "50"
# Kill switch: flip to "false" and redeploy to pause the whole free tier.
HOSTED_ENABLED = "true"
# Oldest app version the hosted service accepts; "0.0.0" disables the gate.
MIN_APP_VERSION = "0.0.0"

# Update feed: the manifest lives in D1 (table update_manifest, one row per
# platform: 'win' | 'mac-arm64' | 'mac-x64') and points at the installer
# downloads on GitHub Releases (free, no payment method). /updates/<file>
# 302-redirects to the matching asset. Publish with:
#   node scripts/upload-update.mjs --platform win --file dist/<exe> \
#     --platform mac-arm64 --file dist/<dmg> [--upload] --notes "..."
# No R2 binding is needed; R2 requires a payment method even on its free tier.

[[d1_databases]]
binding = "DB"
database_name = "screen-scout-relay"
database_id = "d326cdd6-c5d7-40ea-b77e-a876e64d9320"

[ai]
binding = "AI"

[triggers]
crons = ["17 3 * * *"]

# Staging: same code, its own D1 and worker name. Deploy with
#   npx wrangler deploy --env staging
# It has no Groq secret by default (chat 503s upstream) — it exists to prove
# the gates, quota paths, and deploys before production.
[env.staging]
name = "screen-scout-relay-staging"

[env.staging.vars]
PUBLIC_MODEL_ID = "scout-vision-1"
GROQ_MODEL = "openai/gpt-oss-120b"
CF_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
NVIDIA_MODEL = "nvidia/nemotron-3.5-super-vl-120b-a12b"
DEVICE_PER_DAY = "30"
DEVICE_PER_WINDOW = "10"
WINDOW_HOURS = "5"
GLOBAL_GROQ_PER_DAY = "900"
GLOBAL_CF_PER_DAY = "130"
GLOBAL_NVIDIA_PER_DAY = "400"
MAX_BODY_BYTES = "6291456"
REGISTRATIONS_PER_IP_PER_DAY = "20"
GOOGLE_CLIENT_ID = "461964937671-5nkjuee4m9r21uj93hvn99socga293m9.apps.googleusercontent.com"
ACCOUNT_IMAGE_PER_DAY = "5"
ACCOUNT_CHAT_PER_DAY = "50"
HOSTED_ENABLED = "true"
MIN_APP_VERSION = "0.0.0"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "screen-scout-relay-staging"
database_id = "08344e4c-3697-43ff-8a59-84636b1ff593"
