appId: com.screenscout.app
productName: Screen Scout
copyright: Copyright (c) 2026 Screen Scout. All rights reserved.

directories:
  buildResources: assets

files:
  # The main process is fully bundled by electron-vite (zod inlined) and the
  # renderer ships self-hosted fonts — NO node_modules is needed at runtime.
  - "!node_modules/**"
  - out/**
  - assets/**
  - package.json
  - "!**/*.map"

win:
  target:
    - nsis
  icon: assets/icon.png

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: Screen-Scout-${version}-setup.${ext}

# macOS beta build (see README): unsigned, CI-built on GitHub's macOS runners.
# electron-builder converts assets/icon.png to .icns automatically.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.utilities
  # ICNS conversion needs >=512x512; icon.png is the 256px Windows icon.
  icon: assets/icon-512.png
  identity: null
  artifactName: Screen-Scout-${version}-mac-${arch}.${ext}
  extendInfo:
    # Tray-resident app: no Dock icon, no main window at launch.
    LSUIElement: true
    # Shown by the TCC prompt when Screen Recording permission is requested.
    NSScreenCaptureDescription: "Screen Scout captures a screen region only when you start a selection, so you can ask questions about what is on screen."

electronDownload:
  cache: .electron-cache
