name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Screen Scout to do?
      description: Describe the problem you're trying to solve, not just the solution.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which area does it affect?
      options:
        - Capture / region selection
        - Redaction
        - Chat and answers
        - Hosted tier / quotas / Google sign-in
        - BYOK (NVIDIA) mode
        - Settings / shortcuts
        - Installer / packaging
        - macOS or Linux support
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the README's Troubleshooting section and this is not covered there
          required: true
